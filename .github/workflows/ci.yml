name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run tests
        run: swift test --disable-sandbox

      - name: Build universal DMG
        env:
          APP_VERSION: 0.0.0
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/package-dmg.sh

      - name: Verify checksum
        working-directory: dist
        run: shasum -a 256 -c Token-Usage-Monitor-0.0.0-universal.dmg.sha256

      - name: Upload DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Token-Usage-Monitor-${{ github.sha }}
          path: |
            dist/Token-Usage-Monitor-0.0.0-universal.dmg
            dist/Token-Usage-Monitor-0.0.0-universal.dmg.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
