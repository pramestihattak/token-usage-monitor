name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  attestations: write
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Validate version tag
        id: version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: swift test --disable-sandbox

      - name: Build universal DMG
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/package-dmg.sh

      - name: Verify checksum
        working-directory: dist
        run: shasum -a 256 -c "Token-Usage-Monitor-${{ steps.version.outputs.value }}-universal.dmg.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: "dist/Token-Usage-Monitor-${{ steps.version.outputs.value }}-universal.dmg"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/Token-Usage-Monitor-$VERSION-universal.dmg" \
            "dist/Token-Usage-Monitor-$VERSION-universal.dmg.sha256" \
            --verify-tag \
            --generate-notes \
            --title "Token Usage Monitor $VERSION"
